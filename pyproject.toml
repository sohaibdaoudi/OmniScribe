[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniscribe"
version = "0.1.0"
description = "OmniScribe MVP desktop app built with PyQt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf==5.0.1",
    "pyqt6==6.7.1",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "chromadb>=0.4.24",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "sentence-transformers>=2.2.2",
    "easyocr>=1.7.1",      # OCR engine
    "PyMuPDF>=1.24.0",     # PDF rendering (no poppler)
    "Pillow>=10.0.0",
]

[project.scripts]
omniscribe = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]
