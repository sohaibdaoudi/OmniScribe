[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniscribe"
version = "0.1.0"
description = "OmniScribe MVP desktop app built with PyQt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf==5.0.1",
    "pyqt6==6.7.1",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
]

[project.scripts]
omniscribe = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]
